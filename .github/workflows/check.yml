# Sprawdzenie przy każdym pushu i pull requeście: to samo co hook przed commitem (npm run check) –
# składnia JS, dane kursu (validate.js), aktualność data/bundle.js / index.html / sw.js, testy i typy (tsc).
# Tylko sprawdza – nic nie wdraża (GitHub Pages publikuje stronę z gałęzi jak dotąd).
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
